/* RESET PRO - NO DEFORME */

:root{

html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}

.hidden{display:none!important}

/* APP CONTAINER - FIJO Y CENTRADO */

}

/* HEADER PRO */

}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex-shrink:1}

function initScratch(canvas,idx){

      let doc=await tx.get(ref);
      if(!doc.exists) throw "No existe";
      let d=doc.data();if((d.cartones||0)<=0) throw "Sin cartones";
      tx.update(ref,{cartones:d.cartones-1});
      userData.cartones=d.cartones-1;
    });
    juegoIniciado=true;fin=false;
    stopAllSound();if(SOUND_CFG.bgmEnabled&&userSound) playBgm();
    document.getElementById('res').style.display='none';
    document.getElementById('bloqueo').classList.remove('show');
    gen();render();updateUI();
    btn.classList.add('jugando');
    btn.innerHTML=`🔥 JUGANDO...`;
  }catch(e){
    alert(e==="Sin cartones"?'Sin cartones!':'Error: '+e);
    userData=await getUserData(currentUser);updateUI();
  }finally{btn.disabled=false;descontando=false;if(juegoIniciado){btn.innerHTML=`🔥 JUGANDO...`;btn.classList.add('jugando');} else {btn.innerHTML=`🎲 JUGAR AHORA <b>-1 CARTÓN</b>`;}}
}
async function primerCarton(){juegoIniciado=false;fin=false;gen();render();updateUI();let btn=document.getElementById('btnNuevo');btn.innerHTML=`🎲 JUGAR AHORA <b>-1 CARTÓN</b>`;btn.classList.remove('jugando');btn.style.background='linear-gradient(180deg, #00C853, #009624)';}
function renderHist(){let list=document.getElementById('histList');if(!userData.hist.length){list.innerHTML='<div style="text-align:center;color:#555;padding:8px;font-size:9px">Sin jugadas</div>';return}list.innerHTML=userData.hist.slice(0,20).map(h=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1a1a2e;gap:8px"><span style="color:#888;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${h.fecha} • ${h.detalle}</span><span style="font-weight:800;color:${h.monto?'#00E676':'#555'};flex-shrink:0">${h.monto?'+'+h.monto.toLocaleString()+' GS':''}</span></div>`).join('')}
checkSession();loadConfig();loadUserPrefs();
document.addEventListener('click', ()=>{if(Notification&&Notification.permission==="default") Notification.requestPermission();if(SOUND_CFG.bgmEnabled&&userSound&&document.getElementById('audBgm').paused) playBgm()},{once:true});
</script>
