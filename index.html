function renderIcon(icon){if(!icon) return '🎁';if(icon.startsWith('http')) return `<img src="${icon}" style="width:22px;height:22px">`;return icon}
function weightedRandom(list){let t=list.reduce((s,p)=>s+(p.peso||10),0);let r=Math.random()*t;let a=0;for(let p of list){a+=p.peso||10;if(r<=a) return p}return list[0]}
function toggleHistorial(el){let sec=document.getElementById('sec-historial');if(sec.classList.contains('hidden')){sec.classList.remove('hidden');el.classList.add('active');renderHist()}else{sec.classList.add('hidden');el.classList.remove('active')}}
async function getUserData(u){let s=await db.collection('users_data').doc(u).get();if(s.exists) return s.data();return {saldo:0,cartones:0,ganados:0,hist:[],lotes:[],bloqueado:false}}
function updateUI(){if(!userData) return;document.getElementById('saldo').textContent=userData.saldo.toLocaleString('es-PY')+' GS';document.getElementById('cartones').textContent=userData.cartones;document.getElementById('ganados').textContent=userData.ganados;if(userData.lotes?.[0]) document.getElementById('loteInfo').textContent=userData.lotes[0].lote}
function iniciarListenerCartones(){if(!currentUser) return;if(unsubCartones) unsubCartones();let ref=db.collection('users_data').doc(currentUser);unsubCartones=ref.onSnapshot((doc)=>{if(!doc.exists||!userData) return;let data=doc.data();let antes=userData.cartones;let nuevos=data.cartones||0;let saldoAntes=userData.saldo;userData={...userData,...data};if(nuevos>antes){let diff=nuevos-antes;let chip=document.getElementById('cartones');chip.style.transform='scale(1.3)';chip.style.color='#00E676';mostrarNotificacionCarga(diff,nuevos);if(SOUND_CFG.winEnabled) playSound('audWinNormal',0.9);vibrate([40,30,80]);setTimeout(()=>{chip.style.transform='scale(1)';chip.style.color='';},600);}if((data.saldo||0)>saldoAntes){let chipS=document.getElementById('saldo');chipS.style.transform='scale(1.2)';chipS.style.color='#FFD700';setTimeout(()=>{chipS.style.transform='scale(1)';chipS.style.color='';},600);}updateUI();});}
function mostrarNotificacionCarga(cant,total){let ex=document.getElementById('notifCarga');if(ex) ex.remove();let div=document.createElement('div');div.id='notifCarga';div.style.cssText=`position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg, #00E676, #00C853);color:#000;border-radius:16px;padding:16px 20px;font-weight:900;font-size:14px;z-index:9999;box-shadow:0 10px 40px rgba(0,230,118,.5);text-align:center;animation:popIn .4s forwards;font-family:'Orbitron'`;div.innerHTML=`<div style="font-size:28px">🎉</div><div>+${cant} CARTON${cant>1?'ES':''}</div><div style="font-size:10px;margin-top:2px;opacity:.8">TOTAL: ${total}</div>`;document.body.appendChild(div);setTimeout(()=>{div.style.transition='.4s';div.style.opacity='0';div.style.transform='translate(-50%,-50%) scale(0.8)';setTimeout(()=>div.remove(),400)},2500);}
const NOMBRES_FAKE=["carlos***","maria***","juan***","ana***","diego***","luis***","sofia***","pedro***","laura***","javi***","rodrigo***","camila***","oscar***","lucas***","vale***","nico***","fer***","gaby***","mario***","elias***"];const PREMIOS_FAKE=[30000,50000,100000,30000,50000,30000,100000,50000,30000,200000,50000,30000];
function generarGanadores(){let track=document.getElementById('winnersTrack');if(!track) return;let html='';for(let i=0;i<25;i++){let nombre=NOMBRES_FAKE[Math.floor(Math.random()*NOMBRES_FAKE.length)];let monto=PREMIOS_FAKE[Math.floor(Math.random()*PREMIOS_FAKE.length)];let hace=Math.floor(Math.random()*12)+1;let icono=monto>=100000?'💎':monto>=50000?'🍀':'🍉';html+=`<div class="winner-item"><div class="win-icon">${icono}</div><span class="win-user">${nombre}</span><span class="win-amount">+${monto.toLocaleString('es-PY')} GS</span><span class="win-time">hace ${hace}min</span><span style="color:#00E676">●</span></div>`;}track.innerHTML=html+html;}
function agregarGanadorReal(usuario,monto){let track=document.getElementById('winnersTrack');if(!track) return;let item=document.createElement('div');item.className='winner-item';item.style.cssText='background:rgba(0,230,118,.15);border:1px solid rgba(0,230,118,.3);border-radius:20px;padding:3px 10px;';item.innerHTML=`<div class="win-icon">🎉</div><span class="win-user">${usuario.substring(0,4)}***</span><span class="win-amount">+${monto.toLocaleString()} GS</span><span style="color:#00E676;font-size:7px;font-weight:900">AHORA</span>`;track.prepend(item);setTimeout(()=>item.remove(),15000);}
setInterval(generarGanadores,60000);
async function login(){const u=document.getElementById('user').value.trim().toLowerCase();const p=document.getElementById('pass').value.trim();const err=document.getElementById('err');if(!u||!p){err.style.display='block';err.textContent='Usuario y pass';return}err.style.display='block';err.textContent='Verificando...';try{let snap=await db.collection('users').doc(u).get();if(!snap.exists){err.textContent='No existe';return}if(snap.data().pass!==p){err.textContent='Pass mal';return}userData=await getUserData(u);if(userData.bloqueado){err.textContent='Bloqueado';return}currentUser=u;if(document.getElementById('remember').checked) localStorage.setItem('rv_session',u);else sessionStorage.setItem('rv_session',u);document.getElementById('userName').textContent=u;document.getElementById('loginScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');document.getElementById('gameScreen').style.display='flex';await loadConfig();await primerCarton();err.style.display='none';iniciarListenerCartones();setTimeout(playBgm,500)}catch(e){err.textContent=e.message}}
async function checkSession(){let s=localStorage.getItem('rv_session')||sessionStorage.getItem('rv_session');if(!s||s==='admin') return;currentUser=s;document.getElementById('userName').textContent=s;document.getElementById('loginScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');document.getElementById('gameScreen').style.display='flex';userData=await getUserData(s);await loadConfig();gen();render();updateUI();iniciarListenerCartones();}
function logout(){if(unsubCartones) unsubCartones();stopAllSound();localStorage.removeItem('rv_session');sessionStorage.removeItem('rv_session');location.reload()}
function gen(){let premios=PREMIOS.filter(p=>!p.bomba);let bomba=PREMIOS.find(p=>p.bomba)||{icon:'💣',bomba:true};tab=[];ras=Array(9).fill(false);intentos=0;fin=false;MAX=CFG.intentos;for(let i=0;i<8;i++) tab.push(weightedRandom(premios));tab.push(bomba);tab.sort(()=>Math.random()-0.5)}
function render(){const g=document.getElementById('grid');g.innerHTML='';const num=Math.floor(Math.random()*90000)+10000;document.getElementById('serieTxt').textContent='CARTON '+num;tab.forEach((s,idx)=>{const w=document.createElement('div');w.className='celda-wrap';const celda=document.createElement('div');celda.className='celda';let iconHtml=renderIcon(s.icon);let labelTxt=s.bomba?'BOMBA':(s.valor||0).toLocaleString()+' GS';celda.innerHTML=s.bomba?`<div style="font-size:20px">${iconHtml}</div><div style="font-size:5px;color:#ff1744;font-weight:800">BOMBA</div>`:`<div style="font-size:20px">${iconHtml}</div><div style="font-size:5px;font-weight:800">${labelTxt}</div>`;const canvas=document.createElement('canvas');canvas.className='capa-casino';w.appendChild(celda);w.appendChild(canvas);g.appendChild(w);initScratch(canvas,idx)});document.getElementById('res').style.display='none';document.getElementById('res').className='res-casino';document.getElementById('bloqueo').classList.remove('show');let cont=document.getElementById('circCont');cont.innerHTML='';for(let i=1;i<=MAX;i++) cont.innerHTML+=`<div class="dot" id="c${i}">${i}</div>`;document.getElementById('rest').textContent=MAX}
function initScratch(canvas,idx){
  const dpr=window.devicePixelRatio||1;let ctx,w,h;
  function resize(){const rect=canvas.getBoundingClientRect();if(!rect.width||rect.width<10){setTimeout(resize,50);return}canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);w=rect.width;h=rect.height;let grad=ctx.createLinearGradient(0,0,w,h);grad.addColorStop(0,'#d4af37');grad.addColorStop(0.5,'#8a6d3b');grad.addColorStop(1,'#d4af37');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);ctx.fillStyle='rgba(0,0,0,.3)';ctx.font='700 8px Montserrat';ctx.textAlign='center';ctx.fillText('RASPÁ',w/2,h/2+2)}resize();
  let isDrawing=false,moves=0,counted=false;
  function getPos(e){let r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
  function scratch(x,y){if(!ctx) return;ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.fill()}
  async function onDown(e){if(fin||ras[idx]||counted) return;e.preventDefault();isDrawing=true;moves=0;try{canvas.setPointerCapture(e.pointerId)}catch{}if(!ras[idx]){ras[idx]=true;counted=true;intentos++;let c=document.getElementById('c'+intentos);if(c){c.classList.add('done');c.textContent='✓'}document.getElementById('rest').textContent=MAX-intentos;if(SOUND_CFG.scratchEnabled) playSound('audScratch',0.6);vibrate(20)}let p=getPos(e);scratch(p.x,p.y);}
  function onMove(e){if(!isDrawing||fin) return;e.preventDefault();let p=getPos(e);scratch(p.x,p.y);moves++;if(moves>10) finishCell()}
  function onUp(e){if(!isDrawing) return;isDrawing=false;if(moves>3) finishCell()}
  function finishCell(){if(canvas.classList.contains('raspada')) return;canvas.classList.add('raspada');isDrawing=false;if(SOUND_CFG.enabled) playSound('audReveal',0.5);setTimeout(()=>{const s=tab[idx];if(s.bomba){explotar();return}evalGame()},200)}
  canvas.addEventListener('pointerdown',onDown,{passive:false});canvas.addEventListener('pointermove',onMove,{passive:false});canvas.addEventListener('pointerup',onUp);
}
async function evalGame(){if(intentos<MAX) return;let vis=[];ras.forEach((v,i)=>{if(v) vis.push(tab[i])});if(vis.some(s=>s.bomba)) return;let cnt={},map={};vis.forEach(s=>{let k=s.icon;cnt[k]=(cnt[k]||0)+1;map[k]=s});let max=0,key=null;for(let k in cnt){if(cnt[k]>max){max=cnt[k];key=k}}let premio=map[key];if(!premio) return await perder();let req=premio.requiere||3;if(max>=req){if(premio.jackpot||req==4) await ganarMayor(premio);else await ganar(premio)}else await perder()}
function revelarTodas(winnerIcon){document.querySelectorAll('.capa-casino').forEach(c=>c.classList.add('raspada'));document.querySelectorAll('.celda-wrap').forEach((w,i)=>{w.classList.add('revelada');if(tab[i]&&tab[i].icon===winnerIcon&&!tab[i].bomba) w.classList.add('ganadora')});setTimeout(()=>{document.querySelectorAll('.celda-wrap').forEach(w=>w.classList.remove('revelada','ganadora'))},SOUND_CFG.revealTime||3000)}
async function ganar(p){fin=true;revelarTodas(p.icon);if(SOUND_CFG.winEnabled) playSound('audWinNormal',SOUND_CFG.sfxVol);vibrate(SOUND_CFG.vibraWin);agregarGanadorReal(currentUser,p.valor);userData.saldo+=p.valor;userData.ganados++;userData.hist.unshift({fecha:new Date().toLocaleString(),detalle:`Ganó ${p.requiere||3}x ${p.valor.toLocaleString()}`,monto:p.valor});await db.collection('users_data').doc(currentUser).set({saldo:userData.saldo,ganados:userData.ganados,hist:userData.hist},{merge:true});document.getElementById('bloqueo').classList.add('show');document.getElementById('bloqueo').innerHTML=`<div style="font-size:36px">${renderIcon(p.icon)}</div><div>x${p.requiere||3}</div><div style="font-size:13px;color:var(--gold)">+${p.valor.toLocaleString()} GS</div>`;let r=document.getElementById('res');r.className='res-casino gana';r.innerHTML=`🎉 +${p.valor.toLocaleString()} GS`;document.querySelectorAll('.capa-casino').forEach(c=>c.style.pointerEvents='none')}
async function ganarMayor(p){fin=true;revelarTodas(p.icon);if(SOUND_CFG.winEnabled) playSound('audWinJack',SOUND_CFG.sfxVol);vibrate(SOUND_CFG.vibraWinJack);agregarGanadorReal(currentUser,p.valor);userData.saldo+=p.valor;userData.ganados++;userData.hist.unshift({fecha:new Date().toLocaleString(),detalle:`JACKPOT ${p.valor.toLocaleString()}`,monto:p.valor});await db.collection('users_data').doc(currentUser).set({saldo:userData.saldo,ganados:userData.ganados,hist:userData.hist},{merge:true});document.getElementById('bloqueo').classList.add('show');document.getElementById('bloqueo').innerHTML=`<div style="font-size:13px;color:var(--gold)">JACKPOT</div><div style="font-size:38px">${renderIcon(p.icon)}</div><div style="font-size:14px;color:var(--gold)">+${p.valor.toLocaleString()} GS</div>`;let r=document.getElementById('res');r.className='res-casino gana';r.innerHTML=`👑 JACKPOT +${p.valor.toLocaleString()} GS`;document.querySelectorAll('.capa-casino').forEach(c=>c.style.pointerEvents='none')}
async function explotar(){fin=true;revelarTodas(null);if(SOUND_CFG.loseEnabled){playSound('audBomb',SOUND_CFG.sfxVol);setTimeout(()=>playSound('audLose',0.8),250)}vibrate(SOUND_CFG.vibraBomb);userData.hist.unshift({fecha:new Date().toLocaleString(),detalle:'💣 BOMBA',monto:0});await db.collection('users_data').doc(currentUser).set({hist:userData.hist},{merge:true});document.getElementById('bloqueo').classList.add('show');document.getElementById('bloqueo').innerHTML=`<div style="font-size:38px">💥</div><div>BOMBA</div><div style="font-size:10px;color:#FF1744">PERDISTE</div>`;let r=document.getElementById('res');r.className='res-casino pierde';r.innerHTML=`💣 BOMBA`;document.querySelectorAll('.capa-casino').forEach(c=>c.style.pointerEvents='none');let dot=document.getElementById('c'+intentos);if(dot){dot.classList.add('bomb');dot.textContent='💣'}}
async function perder(){fin=true;revelarTodas(null);if(SOUND_CFG.loseEnabled) playSound('audLose',0.7);vibrate(SOUND_CFG.vibraLose);userData.hist.unshift({fecha:new Date().toLocaleString(),detalle:'Perdió',monto:0});await db.collection('users_data').doc(currentUser).set({hist:userData.hist},{merge:true});document.getElementById('bloqueo').classList.add('show');document.getElementById('bloqueo').innerHTML=`<div style="font-size:28px">😅</div><div>SIN PREMIO</div>`;let r=document.getElementById('res');r.className='res-casino pierde';r.innerHTML=`😅 Sin premio`;document.querySelectorAll('.capa-casino').forEach(c=>c.style.pointerEvents='none')}
async function nuevo(){
  if(descontando) return;
  if(userData.cartones<=0){alert('Sin cartones! Contacta a tu agente');return}
  descontando=true;
  let btn=document.getElementById('btnNuevo');
  let orig=btn.innerHTML;btn.innerHTML='⏳ CARGANDO...';btn.disabled=true;
  try{
    let ref=db.collection('users_data').doc(currentUser);
    await db.runTransaction(async (tx)=>{
      let doc=await tx.get(ref);
      if(!doc.exists) throw "No existe";
      let d=doc.data();if((d.cartones||0)<=0) throw "Sin cartones";
      tx.update(ref,{cartones:d.cartones-1});
      userData.cartones=d.cartones-1;
    });
    stopAllSound();if(SOUND_CFG.bgmEnabled&&userSound) playBgm();
    document.getElementById('res').style.display='none';document.getElementById('bloqueo').classList.remove('show');
    gen();render();updateUI();
  }catch(e){
    alert(e==="Sin cartones"?'Sin cartones!':'Error: '+e);
    userData=await getUserData(currentUser);updateUI();
  }finally{btn.innerHTML=orig;btn.disabled=false;descontando=false;}
}
async function primerCarton(){
  if(userData.cartones>0 && !sessionStorage.getItem('rv_first_'+currentUser)){
    sessionStorage.setItem('rv_first_'+currentUser,'1');
  }
  gen();render();updateUI();
}
function renderHist(){let list=document.getElementById('histList');if(!userData.hist.length){list.innerHTML='<div style="text-align:center;color:#555;padding:8px;font-size:9px">Sin jugadas</div>';return}list.innerHTML=userData.hist.slice(0,20).map(h=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1a1a2e"><span style="color:#888">${h.fecha} • ${h.detalle}</span><span style="font-weight:800;color:${h.monto?'#00E676':'#555'}">${h.monto?'+'+h.monto.toLocaleString()+' GS':''}</span></div>`).join('')}
checkSession();loadConfig();loadUserPrefs();
document.addEventListener('click', ()=>{if(Notification&&Notification.permission==="default") Notification.requestPermission();if(SOUND_CFG.bgmEnabled&&userSound&&document.getElementById('audBgm').paused) playBgm()},{once:true});
</script>
